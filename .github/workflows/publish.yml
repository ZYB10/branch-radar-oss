name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test release on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify release commit belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Verify versions and run tests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m unittest discover -s tests -p "test_*.py"

  build:
    name: Static checks and build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install development tools
        run: python -m pip install ".[dev]"
      - name: Run static checks
        run: |
          ruff check .
          mypy --platform=linux
          mypy --platform=darwin
          node --check src/branch_radar/resources/web/theme-bootstrap.js
          node --check src/branch_radar/resources/web/app.js
          node --check src/branch_radar/resources/web/ui-model.js
          node --test tests/web_ui_model.test.js
      - name: Build wheel and source distribution
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Trusted publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/branch-radar
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
