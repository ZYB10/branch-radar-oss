name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install static analysis tools
        run: python -m pip install "mypy==1.17.1" "ruff==0.16.1"
      - name: Run Ruff
        run: ruff check --output-format=github .
      - name: Run mypy for supported platforms
        run: |
          mypy --platform=linux
          mypy --platform=darwin
      - name: Check browser JavaScript syntax
        run: |
          node --check src/branch_radar/resources/web/theme-bootstrap.js
          node --check src/branch_radar/resources/web/app.js
          node --check src/branch_radar/resources/web/ui-model.js
      - name: Run browser UI model tests
        run: node --test tests/web_ui_model.test.js

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build frontend
        run: python -m pip install "build==1.3.0"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          branch-radar --version
