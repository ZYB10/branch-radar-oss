name: Feature request
description: Suggest something Branch Radar should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, not the solution. What did you want to know about your
        branches, and what did you have to do instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A shape for the answer, if you have one.
  - type: checkboxes
    id: constraints
    attributes:
      label: Does this fit the project's constraints
      description: >
        Branch Radar is local-first, stores no credentials, and works without
        Codex, lark-cli or a network. Proposals that hold these are much
        easier to accept.
      options:
        - label: This works without storing any credential
        - label: This works without a network, or degrades cleanly without one
        - label: This needs no third-party Python package
